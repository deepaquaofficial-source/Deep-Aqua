<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEEP Aqua Business Suite</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23061423'/%3E%3Cpath d='M50 20C50 20 34 38 34 50C34 58.8 41.2 66 50 66C58.8 66 66 58.8 66 50C66 38 50 20 50 20Z' fill='%2322d3ee'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============ DEEP Aqua — 3D glass app shell ============ */
:root{
  --bg:#050c17; --bg2:#081426; --deep:#0b3a5e; --deep2:#0d5c8c;
  --teal:#22d3ee; --aqua:#38bdf8; --mint:#5eead4;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --glass3:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --fg:#e9f3fb; --fg2:#cfe2f1; --muted:#8ea8c0;
  --ok:#34d399; --ok-bg:rgba(52,211,153,.14);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.14);
  --bad:#fb7185; --bad-bg:rgba(251,113,133,.15);
  --display:'Sora',Georgia,serif; --body:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:18px; --r2:14px;
  --shadow:0 24px 60px -24px rgba(0,0,0,.75);
  --glow:0 0 0 1px rgba(34,211,238,.22), 0 18px 50px -18px rgba(34,211,238,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
#root{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* animated aurora backdrop */
body::before,body::after{content:"";position:fixed;z-index:-2;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none}
body::before{width:60vw;height:60vw;left:-18vw;top:-22vw;background:radial-gradient(circle at 40% 40%,#0e7490,#0b3a5e 60%,transparent 70%);animation:float1 22s ease-in-out infinite}
body::after{width:55vw;height:55vw;right:-16vw;bottom:-20vw;background:radial-gradient(circle at 60% 60%,#1d4ed8,#0b3a5e 55%,transparent 70%);animation:float2 26s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,5vh,0) scale(1.12)}}
@keyframes float2{0%,100%{transform:translate3d(0,0,0) scale(1.05)}50%{transform:translate3d(-5vw,-6vh,0) scale(.95)}}
h1,h2,h3{margin:0;font-weight:600;font-family:var(--display);line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num,td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
a{color:var(--teal)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);border-radius:12px;padding:10px 15px;font-weight:600;font-size:13.5px;cursor:pointer;background:var(--glass);color:var(--fg);white-space:nowrap;text-decoration:none;
  transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s,background .18s,border-color .18s;transform-style:preserve-3d;backdrop-filter:blur(10px)}
.btn:hover{transform:translateY(-2px) translateZ(14px);background:var(--glass2);border-color:rgba(34,211,238,.5);box-shadow:0 12px 26px -12px rgba(34,211,238,.6)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--teal),var(--aqua) 55%,#2563eb);color:#03212e;border-color:transparent;box-shadow:0 12px 30px -14px rgba(34,211,238,.9)}
.btn.primary:hover{box-shadow:0 18px 40px -14px rgba(34,211,238,1)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--glass)}
.btn.danger{color:var(--bad);border-color:rgba(251,113,133,.45)}
.btn.danger:hover{background:var(--bad-bg);box-shadow:0 12px 26px -14px rgba(251,113,133,.8)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn svg,.ico{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

/* ---- fields ---- */
.field{display:grid;gap:6px;min-width:0}
.field>span{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;font-size:14.5px;min-width:0;color:var(--fg);
  transition:border-color .18s,box-shadow .18s,background .18s;backdrop-filter:blur(8px)}
input::placeholder,textarea::placeholder{color:#6d87a0}
input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:none;background:rgba(255,255,255,.08);box-shadow:0 0 0 4px rgba(34,211,238,.16)}
select option{background:#0b1a2b;color:var(--fg)}
input[type=date]{color-scheme:dark}
textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:9px;align-items:center;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--teal)}

/* ================= LOGIN ================= */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;perspective:1400px}
.auth-art{position:relative;overflow:hidden;padding:52px max(34px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:30px;
  background:linear-gradient(150deg,#061423,#0a3450 45%,#06283f)}
.auth-art::after{content:"";position:absolute;inset:auto -10% -30% -10%;height:60%;background:radial-gradient(ellipse at 50% 100%,rgba(34,211,238,.35),transparent 65%);filter:blur(30px)}
.auth-art .lg{background:rgba(255,255,255,.93);border-radius:16px;padding:12px 18px;width:max-content;box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
.auth-art .lg img{height:40px;display:block}
.auth-art h1{font-size:clamp(32px,4vw,52px);color:#fff;max-width:14ch;position:relative;z-index:2}
.auth-art p{color:#a8c7dc;max-width:46ch;position:relative;z-index:2}
.auth-art ul{list-style:none;padding:0;margin:0;display:grid;gap:9px;font-size:14px;color:#bcd6e6;position:relative;z-index:2}
.auth-art li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:11px;vertical-align:middle;box-shadow:0 0 12px var(--teal)}
/* 3D floating bottle */
.stage{position:absolute;right:4%;top:50%;transform:translateY(-50%);width:320px;height:420px;perspective:900px;z-index:1;pointer-events:none;opacity:.95}
.bottle{position:absolute;inset:0;margin:auto;width:150px;height:330px;transform-style:preserve-3d;animation:spin3d 16s linear infinite}
@keyframes spin3d{0%{transform:rotateY(0) rotateX(8deg) translateY(0)}50%{transform:rotateY(180deg) rotateX(8deg) translateY(-18px)}100%{transform:rotateY(360deg) rotateX(8deg) translateY(0)}}
.bottle i{position:absolute;inset:0;border-radius:22px 22px 16px 16px;border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(34,211,238,.26) 42%,rgba(13,92,140,.55));
  box-shadow:inset 0 0 40px rgba(34,211,238,.35),0 40px 70px -30px rgba(34,211,238,.6);backdrop-filter:blur(2px)}
.bottle i:nth-child(2){transform:rotateY(90deg);opacity:.75}
.bottle b{position:absolute;left:50%;top:-34px;width:52px;height:40px;transform:translateX(-50%);border-radius:8px;background:linear-gradient(180deg,#e2e8f0,#94a3b8);box-shadow:0 10px 20px -8px #000}
.bottle u{position:absolute;left:8px;right:8px;top:120px;height:96px;border-radius:10px;background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(190,230,245,.7));text-decoration:none}
.bubbles{position:absolute;inset:0;overflow:hidden}
.bubbles span{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(34,211,238,.25));animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.85}100%{transform:translateY(-110vh) scale(1.2);opacity:0}}
.auth-main{display:grid;place-items:center;padding:40px max(20px,env(safe-area-inset-right,0px))}
.auth-card{width:min(430px,100%);display:grid;gap:18px;padding:34px 30px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.04));
  border:1px solid var(--line2);box-shadow:var(--shadow);backdrop-filter:blur(22px);transform-style:preserve-3d;transition:transform .2s ease-out;animation:cardIn .7s cubic-bezier(.2,.8,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) rotateX(10deg)}to{opacity:1;transform:none}}
.auth-card h2{font-size:30px}
.auth-card .sub{color:var(--muted);font-size:14px}
.auth-card form{display:grid;gap:14px;transform:translateZ(30px)}
.msg{border-radius:12px;padding:11px 13px;font-size:13.5px;border:1px solid transparent}
.msg.err{background:var(--bad-bg);color:#ffd4da;border-color:rgba(251,113,133,.35)}
.msg.ok{background:var(--ok-bg);color:#c8f7e4;border-color:rgba(52,211,153,.35)}
.msg.info{background:rgba(56,189,248,.12);color:#cbeafd;border-color:rgba(56,189,248,.3)}
.linkbtn{background:none;border:0;color:var(--teal);cursor:pointer;padding:0;font-weight:600;font-size:13.5px}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-art{padding:26px 20px;min-height:230px}.auth-art .hideable{display:none}.stage{width:170px;height:230px;right:-10px;opacity:.6}}

/* ================= APP SHELL ================= */
.app{display:grid;grid-template-columns:262px 1fr;min-height:100%}
.side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px calc(16px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(185deg,rgba(10,30,50,.92),rgba(5,14,26,.92));border-right:1px solid var(--line);backdrop-filter:blur(20px);z-index:40}
.side .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.side .brand .lg{background:rgba(255,255,255,.95);border-radius:12px;padding:7px 10px;box-shadow:0 12px 24px -14px rgba(34,211,238,.9)}
.side .brand img{height:24px;display:block}
.side .brand small{font:600 9.5px/1.35 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}
.side nav{display:grid;gap:3px;overflow:auto;flex:1;padding-right:3px;perspective:800px}
.side .grp{font:600 9.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#6e8da8;padding:16px 10px 7px}
.side nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--fg2);font-size:13.8px;font-weight:500;
  border:1px solid transparent;transition:transform .18s cubic-bezier(.2,.8,.3,1),background .18s,border-color .18s,color .18s;transform-style:preserve-3d}
.side nav a:hover{background:var(--glass);transform:translateX(5px) translateZ(12px);color:#fff}
.side nav a.on{background:linear-gradient(100deg,rgba(34,211,238,.22),rgba(34,211,238,.05));border-color:rgba(34,211,238,.4);color:#fff;box-shadow:0 10px 26px -16px rgba(34,211,238,.9)}
.side nav a.on .ico{color:var(--teal)}
.side .me{border-top:1px solid var(--line);padding:14px 8px 0;margin-top:12px;display:grid;gap:9px}
.side .me b{font-weight:600;color:#fff;font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .me span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:rgba(6,15,26,.72);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:14px max(26px,env(safe-area-inset-right,0px)) 14px 26px;min-height:66px}
.top h1{font-size:25px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .mode{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok);border:1px solid rgba(52,211,153,.35)}
.top .mode i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:7px;box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.menu-btn{display:none}
.content{padding:26px max(26px,env(safe-area-inset-right,0px)) 60px 26px;display:grid;gap:22px;align-content:start;min-width:0;perspective:1200px}
.content>*{animation:viewIn .5s cubic-bezier(.2,.8,.3,1) backwards}
.content>*:nth-child(2){animation-delay:.06s}.content>*:nth-child(3){animation-delay:.12s}.content>*:nth-child(4){animation-delay:.18s}
@keyframes viewIn{from{opacity:0;transform:translateY(18px) rotateX(6deg)}to{opacity:1;transform:none}}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:60;transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,.8,.3,1);padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}
  .menu-btn{display:inline-flex}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding:18px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
}
@media (max-width:640px){.top .mode{display:none}.top h1{font-size:20px}.top [data-new] span{display:none}}

/* ---- cards / kpis / tables ---- */
.card{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:var(--r);min-width:0;
  box-shadow:var(--shadow);backdrop-filter:blur(16px);overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.3,1),border-color .25s}
.card:hover{border-color:var(--line2)}
.card-h{display:flex;align-items:center;gap:11px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-family:var(--body);font-weight:600;font-size:15.5px;flex:1;letter-spacing:0}
.card-b{padding:20px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.kpi{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:7px;min-width:0;
  box-shadow:var(--shadow);backdrop-filter:blur(14px);transform-style:preserve-3d;transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s,border-color .22s}
.kpi::after{content:"";position:absolute;inset:0;border-radius:var(--r);background:linear-gradient(130deg,rgba(34,211,238,.18),transparent 55%);opacity:0;transition:opacity .25s;pointer-events:none}
.kpi:hover{transform:translateY(-6px) rotateX(6deg) rotateY(-4deg);box-shadow:var(--glow);border-color:rgba(34,211,238,.45)}
.kpi:hover::after{opacity:1}
.kpi span{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kpi b{font:600 25px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(120deg,#fff,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi small{color:var(--muted);font-size:12px}
.kpi.alert b{background:linear-gradient(120deg,#fff,var(--bad));-webkit-background-clip:text;background-clip:text;color:transparent}
@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:660px){.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:21px}}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.8px}
table.t th{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.05);white-space:nowrap;position:sticky;top:0;backdrop-filter:blur(10px)}
table.t td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--fg2)}
table.t tbody tr{transition:background .16s,transform .16s}
table.t tbody tr:hover{background:rgba(34,211,238,.07)}
table.t tfoot td{font-weight:700;background:rgba(255,255,255,.05);border-bottom:0;color:#fff}
table.t .acts{text-align:right;white-space:nowrap}
.empty{padding:44px 18px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--glass2);color:var(--fg2);white-space:nowrap;border:1px solid var(--line)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:rgba(52,211,153,.35)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(251,191,36,.35)}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:rgba(251,113,133,.35)}
.pill.teal{background:rgba(34,211,238,.14);color:var(--teal);border-color:rgba(34,211,238,.35)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.toolbar .field{min-width:150px}
.toolbar .grow{flex:1;min-width:200px}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.form-grid .wide{grid-column:1/-1}
@media (max-width:820px){.form-grid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}

/* ---- document editor ---- */
.doc-head{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:16px}
@media (max-width:900px){.doc-head{grid-template-columns:1fr 1fr}}
.party-box{font-size:12.5px;color:var(--muted);margin-top:5px;min-height:18px}
table.lines td{padding:7px 7px}
table.lines input,table.lines select{padding:8px 9px;font-size:13.5px}
table.lines .qty,table.lines .rate,table.lines .disc,table.lines .gst{width:92px;text-align:right;font-family:var(--mono)}
.totals{display:grid;grid-template-columns:1fr 350px;gap:22px;align-items:start}
@media (max-width:820px){.totals{grid-template-columns:1fr}}
.sum{display:grid;gap:7px;font-size:14px;padding:16px 18px;border-radius:var(--r2);background:rgba(255,255,255,.05);border:1px solid var(--line)}
.sum div{display:flex;justify-content:space-between;gap:12px;color:var(--fg2)}
.sum div span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sum .grand{border-top:1px solid var(--line2);padding-top:11px;margin-top:5px;font-size:20px;font-weight:700;color:#fff}
.sum .grand span:last-child{color:var(--teal)}
.words{font-size:12.5px;color:var(--muted);font-style:italic}
.stockhint{font:500 11px var(--mono);color:var(--muted);margin-top:4px}
.stockhint.low{color:var(--bad)}

/* ---- dialog & toast ---- */
dialog{border:0;border-radius:22px;padding:0;width:min(780px,calc(100% - 22px));max-height:calc(100% - 24px);color:var(--fg);
  background:linear-gradient(160deg,#0d2034,#081625);border:1px solid var(--line2);box-shadow:0 40px 90px -30px #000;animation:dlgIn .28s cubic-bezier(.2,.8,.3,1)}
@keyframes dlgIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(3,10,18,.68);backdrop-filter:blur(6px)}
dialog .dh{display:flex;align-items:center;gap:11px;padding:18px 22px;border-bottom:1px solid var(--line)}
dialog .dh h3{font-size:21px;flex:1}
dialog .db{padding:22px;overflow:auto;max-height:calc(100vh - 180px)}
dialog .df{display:flex;justify-content:flex-end;gap:11px;padding:16px 22px;border-top:1px solid var(--line);background:rgba(255,255,255,.04);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:linear-gradient(135deg,var(--teal),var(--aqua));color:#042430;
  padding:12px 18px;border-radius:12px;font-weight:600;font-size:13.5px;z-index:200;max-width:calc(100% - 32px);box-shadow:0 20px 40px -16px rgba(34,211,238,.8);animation:toastIn .3s cubic-bezier(.2,.8,.3,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.err{background:linear-gradient(135deg,#fb7185,#f43f5e);color:#2b0710;box-shadow:0 20px 40px -16px rgba(251,113,133,.8)}

/* ---- charts ---- */
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:7px;align-items:end;height:190px;padding-top:10px;perspective:700px}
.bars .b{display:grid;gap:7px;align-items:end;justify-items:center;height:100%;grid-template-rows:1fr auto;transform-style:preserve-3d}
.bars .b i{display:block;width:100%;max-width:30px;background:linear-gradient(180deg,var(--teal),#0e7490);border-radius:7px 7px 3px 3px;min-height:3px;
  box-shadow:0 10px 24px -10px rgba(34,211,238,.9);transition:transform .25s;animation:grow .7s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1)}}
.bars .b:hover i{transform:translateZ(22px) scaleX(1.12)}
.bars .b.today i{background:linear-gradient(180deg,#fff,var(--mint))}
.bars .b span{font:500 10px var(--mono);color:var(--muted)}
.list-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.8px;color:var(--fg2)}
.list-row:last-child{border-bottom:0}
.muted{color:var(--muted)}
.row{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.loading-screen{min-height:100vh;display:grid;place-items:center;gap:18px;font:600 11px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.loading-screen::before{content:"";width:54px;height:54px;border-radius:50%;border:2px solid rgba(34,211,238,.2);border-top-color:var(--teal);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.perm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:780px){.perm-grid{grid-template-columns:1fr 1fr}}
.role-card{border:1px solid var(--line);border-radius:14px;padding:14px;font-size:12.5px;display:grid;gap:5px;background:rgba(255,255,255,.04);
  transition:transform .2s,border-color .2s}
.role-card:hover{transform:translateY(-4px) rotateX(5deg);border-color:rgba(34,211,238,.4)}
.role-card b{font-size:13.5px;color:#fff}
</style>

function words(num){
  num=Math.round(+num||0);if(num===0)return 'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=n=>n<20?a[n]:b[Math.floor(n/10)]+(n%10?' '+a[n%10]:'');
  const three=n=>(n>=100?a[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?two(n%100):'');
  let out=[];const cr=Math.floor(num/1e7);num%=1e7;const l=Math.floor(num/1e5);num%=1e5;const th=Math.floor(num/1e3);num%=1e3;
  if(cr)out.push(three(cr)+' Crore');if(l)out.push(two(l)+' Lakh');if(th)out.push(two(th)+' Thousand');if(num)out.push(three(num));
  return out.join(' ');
}

function tilt(el,max){max=max||9;
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    el.style.transform=`perspective(900px) rotateX(${(-y*max).toFixed(2)}deg) rotateY(${(x*max).toFixed(2)}deg) translateZ(6px)`});
  el.addEventListener('pointerleave',()=>{el.style.transform=''});
}

/* ---------------- business logic ---------------- */
function stockOf(pid,upto){
  const p=byId('products',pid);let q=+(p&&p.opening)||0;
  for(const t of ['purchases','purchase_returns','sales','sales_returns','wastage']){
    const sign=DOCS[t].sign;
    for(const d of T(t)){if(upto&&d.date>upto)continue;for(const l of d.items||[])if(l.product_id===pid)q+=sign*(+l.qty||0)}
  }
  return q;
}
function custBalance(cid){
  const c=byId('customers',cid);let b=+(c&&c.opening)||0;
  T('sales').forEach(d=>{if(d.customer_id===cid)b+=+d.total||0});
  T('sales_returns').forEach(d=>{if(d.customer_id===cid)b-=+d.total||0});
  T('receipts').forEach(d=>{if(d.customer_id===cid)b-=+d.amount||0});
  return r2(b);
}
function nextNo(t,date){
  const code=t==='receipts'?'RCT':DOCS[t].code;const pre=`${S.company.prefix||'DA'}/${code}/${fy(date)}/`;
  let max=0;T(t).forEach(d=>{if((d.no||'').startsWith(pre)){const n=parseInt(d.no.slice(pre.length),10);if(n>max)max=n}});
  return pre+String(max+1).padStart(4,'0');
}
function calcDoc(doc,type){
  const cfg=DOCS[type];const party=cfg.party==='customer'?byId('customers',doc.customer_id):cfg.party==='supplier'?byId('suppliers',doc.supplier_id):null;
  const inter=!!(cfg.tax&&party&&party.state&&S.company.state&&party.state!==S.company.state);
  let taxable=0,tax=0;
  doc.items=(doc.items||[]).filter(l=>l.product_id).map(l=>{
    const qty=+l.qty||0,rate=+l.rate||0,disc=+l.disc||0,gst=cfg.tax?(+l.gst||0):0;
    const tx=r2(qty*rate*(1-disc/100)),tt=r2(tx*gst/100);taxable+=tx;tax+=tt;
    return {...l,qty,rate,disc,gst,taxable:tx,tax:tt,total:r2(tx+tt)};
  });
  taxable=r2(taxable);tax=r2(tax);
  doc.interstate=inter;doc.taxable=taxable;doc.igst=inter?tax:0;doc.cgst=inter?0:r2(tax/2);doc.sgst=inter?0:r2(tax-r2(tax/2));
  const g=taxable+tax;doc.roundoff=cfg.tax?r2(Math.round(g)-g):0;doc.total=r2(g+doc.roundoff);
  doc.qty=doc.items.reduce((a,l)=>a+l.qty,0);
  if(party){doc.party_name=party.name;doc.party_gstin=party.gstin||'';doc.party_state=party.state||'';doc.party_address=party.address||'';doc.party_phone=party.phone||''}
  return doc;
}

  const pkey=cfg.party==='customer'?'customer_id':'supplier_id';
  const prods=T('products').filter(p=>p.active!==false||(d.items||[]).some(l=>l.product_id===p.id));
  const pOpts=sel=>`<option value="">Choose product</option>${prods.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}${p.size?' · '+esc(p.size):''}</option>`).join('')}`;
  const body=`<div class="doc-head">
   ${cfg.party?`<label class="field"><span>${esc(cfg.party==='customer'?'Customer':'Supplier')} *</span><select id="party">${`<option value="">Choose ${cfg.party}</option>`+parties.map(p=>`<option value="${p.id}" ${p.id===d[pkey]?'selected':''}>${esc(p.name)}${p.type?' · '+esc(p.type):''}</option>`).join('')}</select><div class="party-box" id="pbox"></div></label>`:`<label class="field"><span>Reason *</span><select id="reason">${['Damaged in transit','Leakage','Expired','Production reject','Sample / free','Other'].map(r=>`<option ${r===d.reason?'selected':''}>${r}</option>`).join('')}</select></label>`}
   <label class="field"><span>Number</span><input type="text" id="no" value="${esc(d.no)}"></label>
   <label class="field"><span>Date</span><input type="date" id="date" value="${esc(d.date)}"></label>
   <label class="field"><span>${esc(cfg.party?cfg.refLabel:'Reference')}</span><input type="text" id="ref" value="${esc(d.ref||'')}"></label></div>
   <div class="tw" style="margin-top:18px"><table class="t lines"><thead><tr><th style="min-width:220px">Product</th><th class="n">Qty</th><th class="n">${cfg.tax?'Rate ₹':'Cost ₹'}</th>${cfg.tax?'<th class="n">Disc %</th><th class="n">GST %</th>':''}<th class="n">Amount</th><th></th></tr></thead><tbody id="lines"></tbody></table></div>
   <button class="btn sm" id="addLine" style="margin-top:12px">${icon('M12 5v14M5 12h14')}Add line</button>
   <div class="totals" style="margin-top:20px"><label class="field"><span>Notes</span><textarea id="notes">${esc(d.notes||'')}</textarea></label><div class="sum" id="sum"></div></div>`;
  const m=modal({title:(existing?(readOnly?'':'Edit ')+cfg.title+' '+d.no:'New '+cfg.title.toLowerCase()),wide:true,body,
    foot:`${existing&&canEdit()?`<button class="btn danger" data-del>Delete</button>`:''}<span class="spacer"></span><button class="btn" data-close>Close</button>${existing?`<button class="btn" data-pdf>${icon('M12 3v12M7 10l5 5 5-5M5 21h14')}Download PDF</button>`:''}${readOnly?'':`<button class="btn" data-savepdf>Save &amp; PDF</button><button class="btn primary" data-save>Save</button>`}`});
  const lines=$('#lines',m);
  const lineRow=(l,i)=>{const p=byId('products',l.product_id);const st=p?stockOf(p.id)+(existing?(existing.items||[]).filter(x=>x.product_id===p.id).reduce((a,x)=>a-cfg.sign*x.qty,0):0):null;
    return `<tr data-i="${i}"><td><select class="prod">${pOpts(l.product_id)}</select>${p?`<div class="stockhint ${cfg.sign<0&&st<(+l.qty||0)?'low':''}">In stock: ${qtyf(st)}${p.hsn?' · HSN '+esc(p.hsn):''}</div>`:''}</td>
    <td><input class="qty" type="number" step="any" min="0" value="${l.qty??''}"></td><td><input class="rate" type="number" step="any" min="0" value="${l.rate??''}"></td>
    ${cfg.tax?`<td><input class="disc" type="number" step="any" min="0" max="100" value="${l.disc??''}"></td><td><input class="gst" type="number" step="any" min="0" value="${l.gst??''}"></td>`:''}
    <td class="n" style="font-weight:600">${l.product_id?inr(l.total||0):''}</td><td><button class="btn ghost sm" data-rm="${i}" aria-label="Remove line">${icon('M18 6 6 18M6 6l12 12')}</button></td></tr>`};
  const collect=()=>{d.date=$('#date',m).value;d.no=$('#no',m).value.trim();d.ref=$('#ref',m).value.trim();d.notes=$('#notes',m).value.trim();
    if(cfg.party)d[pkey]=$('#party',m).value;else d.reason=$('#reason',m).value;
    d.items=$$('tr[data-i]',lines).map(tr=>({...d.items[+tr.dataset.i],product_id:$('.prod',tr).value,qty:$('.qty',tr).value,rate:$('.rate',tr).value,disc:cfg.tax?$('.disc',tr).value:0,gst:cfg.tax?$('.gst',tr).value:0}))};
  const draw=(full)=>{
    if(full)lines.innerHTML=d.items.map(lineRow).join('');
    const calc=calcDoc(JSON.parse(JSON.stringify(d)),type);
    if(!full){$$('tr[data-i]',lines).forEach(tr=>{const l=d.items[+tr.dataset.i];const tx=(+l.qty||0)*(+l.rate||0)*(1-(+l.disc||0)/100);tr.children[cfg.tax?5:3].textContent=l.product_id?inr(r2(tx*(1+(cfg.tax?(+l.gst||0):0)/100))):''})}
    if(cfg.party){const p=byId(cfg.party==='customer'?'customers':'suppliers',d[pkey]);$('#pbox',m).innerHTML=p?`${esc(p.state||'State not set')}${p.gstin?' · GSTIN '+esc(p.gstin):''}${cfg.party==='customer'?' · Outstanding '+inr(custBalance(p.id)):''}${calc.interstate?' · <b>IGST</b>':' · CGST + SGST'}`:''}
    $('#sum',m).innerHTML=`<div><span>Quantity</span><span>${qtyf(calc.qty)}</span></div>${cfg.tax?`<div><span>Taxable value</span><span>${inr(calc.taxable)}</span></div>${calc.interstate?`<div><span>IGST</span><span>${inr(calc.igst)}</span></div>`:`<div><span>CGST</span><span>${inr(calc.cgst)}</span></div><div><span>SGST</span><span>${inr(calc.sgst)}</span></div>`}<div><span>Round off</span><span>${inr(calc.roundoff)}</span></div>`:''}<div class="grand"><span>${type==='wastage'?'Total value':'Grand total'}</span><span>${inr(calc.total)}</span></div><div class="words">${esc(amountWords(calc.total))}</div>`;
  };
  lines.addEventListener('change',e=>{const tr=e.target.closest('tr[data-i]');collect();if(e.target.classList.contains('prod')){const p=byId('products',e.target.value);const l=d.items[+tr.dataset.i];if(p){l.rate=+p[cfg.rate]||+p.rate||0;l.gst=cfg.tax?(+p.gst||0):0;l.name=p.name+(p.size&&!p.name.includes(p.size)?' '+p.size:'');l.hsn=p.hsn||'';if(!l.qty)l.qty=1}draw(true)}else draw(false)});
  lines.addEventListener('input',()=>{collect();draw(false)});
  lines.addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b){collect();d.items.splice(+b.dataset.rm,1);if(!d.items.length)d.items.push({});draw(true)}});
  $('#addLine',m).onclick=()=>{collect();d.items.push({});draw(true);const s=$$('.prod',lines).pop();s&&s.focus()};
  if(cfg.party)$('#party',m).onchange=()=>{collect();draw(false)};
  $('#date',m).onchange=()=>{if(!existing){$('#no',m).value=nextNo(type,$('#date',m).value)}};
  const doSave=async(pdf)=>{collect();const doc=calcDoc(d,type);
    if(cfg.party&&!doc[pkey]){toast(`Choose a ${cfg.party} first.`,1);return}
    if(!doc.items.length||doc.items.some(l=>!(l.qty>0))){toast('Add at least one product with a quantity above zero.',1);return}
    if(T(type).some(x=>x.no===doc.no&&x.id!==doc.id)){toast('That number is already used. Change it.',1);return}
    if(cfg.sign<0){const short=doc.items.filter(l=>{const before=stockOf(l.product_id)+(existing?(existing.items||[]).filter(x=>x.product_id===l.product_id).reduce((a,x)=>a+x.qty,0):0);return l.qty>before});
      if(short.length&&!(await confirmBox(`Stock is not enough for ${short.map(l=>l.name).join(', ')}. Save anyway? Stock will go negative.`,'Save anyway')))return}
    if(type==='sales'&&doc.customer_id){const cu=byId('customers',doc.customer_id);const lim=+cu.credit_limit||0;const after=custBalance(cu.id)+doc.total-(existing?+existing.total||0:0);
      if(lim&&after>lim&&!(await confirmBox(`${cu.name} will owe ${inr(after)}, above the credit limit of ${inr(lim)}. Save anyway?`,'Save anyway')))return}
    doc.user=S.user.name||S.user.email;
    try{const saved=await save(type,doc);m.close();toast(cfg.title+' '+saved.no+' saved');if(pdf)docPdf(type,saved);render()}catch(e){toast('Could not save: '+e.message,1)}};
  const sv=m.querySelector('[data-save]');if(sv)sv.onclick=()=>doSave(false);const sp=m.querySelector('[data-savepdf]');if(sp)sp.onclick=()=>doSave(true);
  const pd=m.querySelector('[data-pdf]');if(pd)pd.onclick=()=>docPdf(type,existing);
  const dl=m.querySelector('[data-del]');if(dl)dl.onclick=async()=>{if(await confirmBox(`Delete ${cfg.title.toLowerCase()} ${existing.no}? Stock and balances will be recalculated.`,'Delete')){try{await del(type,existing.id);m.close();toast('Deleted');render()}catch(e){toast(e.message,1)}}};
  if(readOnly)$$('input,select,textarea,#addLine,[data-rm]',m.querySelector('.db')).forEach(el=>el.disabled=true);
  draw(true);
}

function editReceipt(r){
  const isNew=!r.id;if(isNew)r={date:today(),mode:'UPI',no:nextNo('receipts',today())};
  const d=modal({title:isNew?'Record payment received':'Edit payment '+r.no,body:`<div class="form-grid">
   <label class="field wide"><span>Customer *</span><select id="rc"><option value="">Choose customer</option>${T('customers').map(c=>`<option value="${c.id}" ${c.id===r.customer_id?'selected':''}>${esc(c.name)} — owes ${inr(custBalance(c.id))}</option>`).join('')}</select></label>
   <label class="field"><span>Number</span><input type="text" id="rn" value="${esc(r.no)}"></label><label class="field"><span>Date</span><input type="date" id="rd" value="${esc(r.date)}"></label>
   <label class="field"><span>Amount ₹ *</span><input type="number" step="any" id="ra" value="${esc(r.amount??'')}"></label>
   <label class="field"><span>Mode</span><select id="rm">${['Cash','UPI','Bank transfer','Cheque','Card','Other'].map(x=>`<option ${x===r.mode?'selected':''}>${x}</option>`).join('')}</select></label>

   <label class="field wide"><span>Notes</span><textarea id="rt">${esc(r.notes||'')}</textarea></label></div>`,
   foot:`${!isNew&&canEdit()?'<button class="btn danger" data-del>Delete</button><span class="spacer"></span>':''}<button class="btn" data-close>Cancel</button><button class="btn primary" data-save>Save payment</button>`});
  $('#rc',d).onchange=e=>{const id=e.target.value;$('#rg',d).innerHTML='<option value="">On account</option>'+T('sales').filter(s=>s.customer_id===id).reverse().map(s=>`<option>${esc(s.no)}</option>`).join('')};
  d.querySelector('[data-save]').onclick=async()=>{const o={...r,customer_id:$('#rc',d).value,no:$('#rn',d).value.trim(),date:$('#rd',d).value,amount:r2($('#ra',d).value),mode:$('#rm',d).value,ref:$('#rr',d).value.trim(),against:$('#rg',d).value,notes:$('#rt',d).value.trim()};
    if(!o.customer_id||!(o.amount>0)){toast('Choose a customer and enter an amount.',1);return}o.party_name=(byId('customers',o.customer_id)||{}).name;o.user=S.user.name||S.user.email;
    try{await save('receipts',o);d.close();toast('Payment saved');render()}catch(e){toast(e.message,1)}};
  const db=d.querySelector('[data-del]');if(db)db.onclick=async()=>{if(await confirmBox('Delete this payment?','Delete')){await del('receipts',r.id);d.close();render()}};
}
function statement(cid){
  const cu=byId('customers',cid);const ev=[];
  T('sales').filter(d=>d.customer_id===cid).forEach(d=>ev.push([d.date,'Invoice '+d.no,d.total,0]));
  T('sales_returns').filter(d=>d.customer_id===cid).forEach(d=>ev.push([d.date,'Sales return '+d.no,0,d.total]));
  T('receipts').filter(d=>d.customer_id===cid).forEach(d=>ev.push([d.date,'Payment '+d.no+(d.mode?' ('+d.mode+')':''),0,d.amount]));
  ev.sort((a,b)=>a[0].localeCompare(b[0]));let bal=+cu.opening||0;const rows=[['','Opening balance','','',bal]];ev.forEach(e=>{bal=r2(bal+(+e[2]||0)-(+e[3]||0));rows.push([e[0],e[1],e[2]||'',e[3]||'',bal])});
  const d=modal({title:'Statement — '+cu.name,wide:true,body:`<div class="tw"><table class="t"><thead><tr><th>Date</th><th>Particulars</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${dfmt(r[0])}</td><td>${esc(r[1])}</td><td class="n">${r[2]!==''?inr(r[2]):''}</td><td class="n">${r[3]!==''?inr(r[3]):''}</td><td class="n"><b>${inr(r[4])}</b></td></tr>`).join('')}</tbody></table></div>`,
    foot:`<button class="btn" data-close>Close</button><button class="btn primary" data-p>Download PDF</button>`});
  d.querySelector('[data-p]').onclick=()=>tablePdf('Statement - '+cu.name,'As on '+dfmt(today()),[{l:'Date'},{l:'Particulars'},{l:'Debit',n:1},{l:'Credit',n:1},{l:'Balance',n:1}],rows.map(r=>[dfmt(r[0]),r[1],r[2]===''?'':+r[2],r[3]===''?'':+r[3],+r[4]]));
}

  {id:'sales_reg',name:'Sales register',roles:['admin','manager','accounts','sales']},
  {id:'product_sales',name:'Product-wise sales',roles:['admin','manager','accounts','sales','store']},

  {id:'outstanding',name:'Customer outstanding',roles:['admin','manager','accounts','sales']},
  {id:'inward_reg',name:'Inward register',roles:['admin','manager','accounts','store']},
  {id:'pr_reg',name:'Purchase returns register',roles:['admin','manager','accounts','store']},
  {id:'wastage_reg',name:'Wastage register',roles:['admin','manager','store']},
  {id:'stock',name:'Stock summary',roles:STAFF},
  {id:'daybook',name:'Day book (all entries)',roles:['admin','manager','accounts']}

function buildReport(id,f,to){
  const N=(l,q)=>({l,n:1,q});const dr=(t)=>T(t).filter(d=>inRange(d.date,f,to)).sort((a,b)=>(a.date+a.no).localeCompare(b.date+b.no));
  const reg=(t)=>{const rows=dr(t).map(d=>[dfmt(d.date),d.no,d.party_name||d.reason||'',d.party_gstin||'',d.qty,d.taxable,r2((+d.cgst||0)+(+d.sgst||0)),+d.igst||0,d.total]);return {cols:[{l:'Date'},{l:'No.'},{l:'Party'},{l:'GSTIN'},N('Qty',1),N('Taxable'),N('CGST+SGST'),N('IGST'),N('Total')],rows,foot:['Total','','','',rows.reduce((a,r)=>a+r[4],0),...[5,6,7,8].map(i=>r2(rows.reduce((a,r)=>a+r[i],0)))]}};
  switch(id){
    case 'sales_reg':return reg('sales');case 'sr_reg':return reg('sales_returns');case 'inward_reg':return reg('purchases');case 'pr_reg':return reg('purchase_returns');
    case 'wastage_reg':{const rows=[];dr('wastage').forEach(d=>(d.items||[]).forEach(l=>rows.push([dfmt(d.date),d.no,d.reason||'',l.name,l.qty,l.total])));return {cols:[{l:'Date'},{l:'No.'},{l:'Reason'},{l:'Product'},N('Qty',1),N('Value')],rows,foot:['Total','','','',rows.reduce((a,r)=>a+r[4],0),r2(rows.reduce((a,r)=>a+r[5],0))]}}
    case 'product_sales':{const m={};dr('sales').forEach(d=>(d.items||[]).forEach(l=>{const k=l.product_id;m[k]=m[k]||{n:l.name,q:0,t:0,tot:0,rq:0,rt:0};m[k].q+=l.qty;m[k].t+=l.taxable;m[k].tot+=l.total}));dr('sales_returns').forEach(d=>(d.items||[]).forEach(l=>{const k=l.product_id;m[k]=m[k]||{n:l.name,q:0,t:0,tot:0,rq:0,rt:0};m[k].rq+=l.qty;m[k].rt+=l.taxable}));
      const rows=Object.values(m).map(v=>[v.n,v.q,r2(v.t),v.rq,r2(v.rt),v.q-v.rq,r2(v.t-v.rt)]).sort((a,b)=>b[6]-a[6]);return {cols:[{l:'Product'},N('Sold qty',1),N('Sales taxable'),N('Returned qty',1),N('Returns taxable'),N('Net qty',1),N('Net taxable')],rows,foot:['Total',...[1,2,3,4,5,6].map(i=>r2(rows.reduce((a,r)=>a+r[i],0)))]}}
    case 'customer_sales':{const m={};dr('sales').forEach(d=>{m[d.customer_id]=m[d.customer_id]||{n:d.party_name,c:0,q:0,s:0,r:0};m[d.customer_id].c++;m[d.customer_id].q+=d.qty;m[d.customer_id].s+=d.total});dr('sales_returns').forEach(d=>{m[d.customer_id]=m[d.customer_id]||{n:d.party_name,c:0,q:0,s:0,r:0};m[d.customer_id].r+=d.total});
      const rows=Object.values(m).map(v=>[v.n,v.c,v.q,r2(v.s),r2(v.r),r2(v.s-v.r)]).sort((a,b)=>b[5]-a[5]);return {cols:[{l:'Customer'},N('Invoices',1),N('Qty',1),N('Sales'),N('Returns'),N('Net')],rows,foot:['Total',...[1,2,3,4,5].map(i=>r2(rows.reduce((a,r)=>a+r[i],0)))]}}
    case 'gst':{const m={};const add=(t,s)=>dr(t).forEach(d=>(d.items||[]).forEach(l=>{const k=(l.hsn||'-')+'|'+l.gst;m[k]=m[k]||{h:l.hsn||'-',g:l.gst,q:0,tx:0,c:0,s:0,i:0};const v=m[k];v.q+=s*l.qty;v.tx+=s*l.taxable;if(d.interstate)v.i+=s*l.tax;else{v.c+=s*r2(l.tax/2);v.s+=s*(l.tax-r2(l.tax/2))}}));add('sales',1);add('sales_returns',-1);
      const rows=Object.values(m).map(v=>[v.h,v.g+'%',v.q,r2(v.tx),r2(v.c),r2(v.s),r2(v.i),r2(v.c+v.s+v.i)]);return {cols:[{l:'HSN'},{l:'GST rate'},N('Net qty',1),N('Taxable'),N('CGST'),N('SGST'),N('IGST'),N('Total tax')],rows,foot:['Total','',...[2,3,4,5,6,7].map(i=>r2(rows.reduce((a,r)=>a+r[i],0)))],note:'Sales minus sales returns in the period. Check with your accountant before filing.'}}
    case 'receipts_reg':{const rows=dr('receipts').map(r=>[dfmt(r.date),r.no,r.party_name,r.mode,r.ref||'',r.against||'On account',+r.amount]);return {cols:[{l:'Date'},{l:'No.'},{l:'Customer'},{l:'Mode'},{l:'Reference'},{l:'Against'},N('Amount')],rows,foot:['Total','','','','','',r2(rows.reduce((a,r)=>a+r[6],0))]}}
    case 'outstanding':{const rows=T('customers').map(c=>{const s=T('sales').filter(d=>d.customer_id===c.id).reduce((a,d)=>a+d.total,0),r=T('sales_returns').filter(d=>d.customer_id===c.id).reduce((a,d)=>a+d.total,0),p=T('receipts').filter(d=>d.customer_id===c.id).reduce((a,d)=>a+(+d.amount||0),0);return [c.name,c.type||'',c.phone||'',+c.opening||0,r2(s),r2(r),r2(p),custBalance(c.id),+c.credit_limit||0]}).filter(r=>r[7]!==0||r[4]).sort((a,b)=>b[7]-a[7]);
      return {cols:[{l:'Customer'},{l:'Type'},{l:'Phone'},N('Opening'),N('Billed'),N('Returns'),N('Received'),N('Balance'),N('Credit limit')],rows,foot:['Total','','',...[3,4,5,6,7,8].map(i=>r2(rows.reduce((a,r)=>a+r[i],0)))],asOn:1}}
    case 'stock':{const rows=T('products').map(p=>{const q=stockOf(p.id,to);return [p.name,p.hsn||'',q,+p.cost||0,r2(q*(+p.cost||0)),+p.rate||0,r2(q*(+p.rate||0))]});return {cols:[{l:'Product'},{l:'HSN'},N('In stock',1),N('Cost'),N('Value at cost'),N('Rate'),N('Value at rate')],rows,foot:['Total','',rows.reduce((a,r)=>a+r[2],0),'',r2(rows.reduce((a,r)=>a+r[4],0)),'',r2(rows.reduce((a,r)=>a+r[6],0))],asOn:1}}
    case 'daybook':{const rows=[];[['sales','Sales invoice'],['sales_returns','Sales return'],['purchases','Inward'],['purchase_returns','Purchase return'],['wastage','Wastage']].forEach(([t,l])=>dr(t).forEach(d=>rows.push([d.date,l,d.no,d.party_name||d.reason||'',d.qty,d.total])));dr('receipts').forEach(r=>rows.push([r.date,'Payment received',r.no,r.party_name,'',+r.amount]));rows.sort((a,b)=>a[0].localeCompare(b[0]));return {cols:[{l:'Date'},{l:'Type'},{l:'No.'},{l:'Party'},N('Qty',1),N('Amount')],rows:rows.map(r=>[dfmt(r[0]),...r.slice(1)])}}
  }
}
RENDER.reports=c=>{
  const list=REPORTS.filter(r=>r.roles.includes(S.user.role));const st=S.rep||{id:list[0].id,f:today().slice(0,8)+'01',to:today()};
  c.innerHTML=`<div class="card"><div class="card-h"><div class="toolbar" style="flex:1"><label class="field grow"><span>Report</span><select id="rid">${list.map(r=>`<option value="${r.id}" ${r.id===st.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label>
   <label class="field"><span>From</span><input type="date" id="f" value="${st.f}"></label><label class="field"><span>To</span><input type="date" id="to" value="${st.to}"></label>
   <div class="row"><button class="btn sm" data-q="today">Today</button><button class="btn sm" data-q="month">This month</button><button class="btn sm" data-q="fy">This FY</button></div></div>
   <button class="btn sm" id="csv">${icon('M12 3v12M7 10l5 5 5-5M5 21h14')}CSV</button><button class="btn primary sm" id="pdf">${icon('M12 3v12M7 10l5 5 5-5M5 21h14')}PDF</button></div><div class="tw" id="out"></div></div>`;
  let cur;
  const draw=()=>{S.rep={id:$('#rid').value,f:$('#f').value,to:$('#to').value};cur=buildReport(S.rep.id,S.rep.f,S.rep.to);
    $('#out').innerHTML=(cur.note?`<div class="msg info" style="margin:14px 20px 0">${esc(cur.note)}</div>`:'')+(cur.rows.length?`<table class="t"><thead><tr>${cur.cols.map(c=>`<th class="${c.n?'n':''}">${esc(c.l)}</th>`).join('')}</tr></thead><tbody>${cur.rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${cur.cols[i].n?'n':''}">${cur.cols[i].n&&typeof v==='number'?(cur.cols[i].q?qtyf(v):inr(v)):esc(v)}</td>`).join('')}</tr>`).join('')}</tbody>${cur.foot?`<tfoot><tr>${cur.foot.map((v,i)=>`<td class="${cur.cols[i].n?'n':''}">${typeof v==='number'?(cur.cols[i].q?qtyf(v):inr(v)):esc(v)}</td>`).join('')}</tr></tfoot>`:''}</table>`:'<div class="empty">Nothing to show for this period.</div>')};
  ['rid','f','to'].forEach(id=>$('#'+id).onchange=draw);
  $$('[data-q]').forEach(b=>b.onclick=()=>{const t=today();let f=t;if(b.dataset.q==='month')f=t.slice(0,8)+'01';if(b.dataset.q==='fy'){const y=+t.slice(0,4),m=+t.slice(5,7);f=(m>=4?y:y-1)+'-04-01'}$('#f').value=f;$('#to').value=t;draw()});
  $('#csv').onclick=()=>download(($('#rid').selectedOptions[0].text)+'.csv',csv([cur.cols.map(c=>c.l),...cur.rows,...(cur.foot?[cur.foot]:[])]),'text/csv');
  $('#pdf').onclick=()=>{const name=$('#rid').selectedOptions[0].text;tablePdf(name,cur.asOn?'As on '+dfmt(S.rep.to):dfmt(S.rep.f)+' to '+dfmt(S.rep.to),cur.cols,cur.rows,cur.foot)};
  draw();
};

  <div class="grid2"><div class="card"><div class="card-h"><h3>My invoices</h3><button class="btn sm" id="stm">Statement</button></div><div class="tw">${inv.length?`<table class="t"><thead><tr><th>No.</th><th>Date</th><th class="n">Qty</th><th class="n">Amount</th><th></th></tr></thead><tbody>${inv.map(d=>`<tr><td>${esc(d.no)}</td><td>${dfmt(d.date)}</td><td class="n">${qtyf(d.qty)}</td><td class="n">${inr(d.total)}</td><td class="acts"><button class="btn sm" data-pdf="${d.id}">PDF</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No invoices yet.</div>'}</div></div>
  <div class="card"><div class="card-h"><h3>Price list</h3></div><div class="tw"><table class="t"><thead><tr><th>Product</th><th class="n">Rate</th><th class="n">GST</th><th class="n">MRP</th></tr></thead><tbody>${T('products').filter(p=>p.active!==false).map(p=>`<tr><td>${esc(p.name)}</td><td class="n">${inr(p.rate)}</td><td class="n">${r2(p.gst)}%</td><td class="n">${inr(p.mrp)}</td></tr>`).join('')}</tbody></table></div></div></div>`;

  const C=S.company;const F=(k,l,t='text')=>fieldHtml([k,l,t],C[k],'c_');
  c.innerHTML=`<div class="card"><div class="card-h"><h3>Company details on invoices</h3></div><div class="card-b"><div class="form-grid" id="cf">
   ${F('name','Brand / trade name')}${F('legal','Legal name')}${F('gstin','GSTIN')}${F('state','State','state')}${F('phone','Phone')}${F('website','Website')}${F('address','Address','textarea')}
   ${F('bank','Bank name')}${F('account','Account number')}${F('ifsc','IFSC')}${F('prefix','Number prefix (e.g. DA)')}${F('terms','Invoice terms','textarea')}</div></div></div>
  <div class="card"><div class="card-h"><h3>Department email addresses</h3></div><div class="card-b"><div class="form-grid">${DEPT.map(([k,l])=>F(k,l+' email','email')).join('')}</div>
   <p class="muted" style="margin-top:14px;font-size:13px">These show on invoices, statements and the partner portal.</p></div></div>
  <div class="card"><div class="card-h"><h3>Logo on invoices</h3></div><div class="card-b row"><span style="background:#fff;border-radius:14px;padding:12px;display:inline-block"><img id="lp" src="${C.logo||window.DEEP_LOGO}" alt="Logo" style="height:48px;display:block"></span><label class="btn">Upload logo<input type="file" id="lf" accept="image/*" hidden></label><button class="btn ghost" id="lr">Use DEEP logo</button></div></div>
  <div class="row"><span class="spacer"></span><button class="btn primary" id="cs">Save company details</button></div>`;
  let logo=C.logo||'';
  $('#lf').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>400000){toast('Use an image under 400 KB.',1);return}const r=new FileReader();r.onload=()=>{logo=r.result;$('#lp').src=logo};r.readAsDataURL(f)};
  $('#lr').onclick=()=>{logo='';$('#lp').src=window.DEEP_LOGO};
  $('#cs').onclick=async()=>{const o={...C,...readFields(c),logo};if(S.companyId)o.id=S.companyId;try{const r=await save('company',o);S.company=r;S.companyId=r.id;await prepLogo();toast('Company details saved')}catch(e){toast(e.message,1)}};

  let users=[];try{users=await DB.profiles()}catch(e){c.innerHTML=`<div class="msg err">${esc(e.message)}</div>`;return}
  const custs=T('customers');
  c.innerHTML=`<div class="card"><div class="card-h"><h3>People who can sign in</h3></div>
  <div class="msg info" style="margin:16px 20px 0">To add someone, create their login once in Supabase → <b>Authentication → Users → Add user</b> (set a password and tick "auto confirm"). They appear here as <b>Waiting for approval</b>; give them a role, and for distributors and agencies link their customer account.</div>
  <div class="tw"><table class="t"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Linked customer</th><th>Active</th><th></th></tr></thead><tbody>
  ${users.map(u=>`<tr data-u="${u.id}"><td><b>${esc(u.name||'')}</b></td><td>${esc(u.email)}</td><td><select class="ur" ${u.id===S.user.id?'disabled':''}>${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===u.role?'selected':''}>${v.name}</option>`).join('')}</select></td>
   <td><select class="uc"><option value="">—</option>${custs.map(cu=>`<option value="${cu.id}" ${cu.id===u.customer_id?'selected':''}>${esc(cu.name)}</option>`).join('')}</select></td>
   <td><input type="checkbox" class="ua" ${u.active!==false?'checked':''} ${u.id===S.user.id?'disabled':''}></td>
   <td class="acts"><button class="btn sm" data-save-u>Save</button></td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><div class="card-h"><h3>What each role can do</h3></div><div class="card-b perm-grid">${Object.entries(ROLES).filter(([k])=>k!=='pending').map(([k,v])=>`<div class="role-card"><b>${v.name}</b><span class="muted">${esc(v.desc)}</span></div>`).join('')}</div></div>`;
  $$('[data-save-u]').forEach(b=>b.onclick=async()=>{const tr=b.closest('tr');const patch={role:$('.ur',tr).value,customer_id:$('.uc',tr).value||null,active:$('.ua',tr).checked};
    if(['distributor','agency'].includes(patch.role)&&!patch.customer_id){toast('Link a customer account for distributor and agency logins.',1);return}

/* ---------------- backup & data ---------------- */
RENDER.data=c=>{
  c.innerHTML=`<div class="card"><div class="card-h"><h3>Backup &amp; data</h3><span class="pill ok">Supabase</span></div><div class="card-b" style="display:grid;gap:14px">
   <p class="muted">All records live in your Supabase project. Everyone who signs in sees the same live data. Take a backup file before any big change.</p>
   <div class="row"><button class="btn primary" id="bk">${icon('M12 3v12M7 10l5 5 5-5M5 21h14')}Download full backup (JSON)</button>
   <label class="btn">Import a backup file<input type="file" id="imp" accept="application/json" hidden></label></div>
   <div class="msg info">Import adds every record from the backup file. It does not delete what is already there, so import into an empty project only.</div>
  </div></div>`;
  $('#bk').onclick=()=>{const o={app:'DEEP Aqua Business Suite',exported:new Date().toISOString(),tables:{}};TABLES.forEach(t=>o.tables[t]=T(t).map(({id,_created,...d})=>({id,data:d})));download('deep-aqua-backup-'+today()+'.json',JSON.stringify(o,null,1),'application/json')};
  $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result);if(!(await confirmBox('Add every record from this backup file into Supabase?','Import')))return;let n=0;for(const t of TABLES){if(t==='company'&&T('company').length)continue;for(const x of (o.tables[t]||[])){await DB.insert(t,x.data);n++}}await loadAll();toast(n+' records imported');render()}catch(err){toast('Import failed: '+err.message,1)}};r.readAsText(f)};
};

/* ---------------- auth screen ---------------- */
function authShell(inner){
  const bub=Array.from({length:14},()=>{const s=4+Math.random()*16;return `<span style="left:${(Math.random()*100).toFixed(1)}%;width:${s.toFixed(0)}px;height:${s.toFixed(0)}px;animation-duration:${(9+Math.random()*12).toFixed(1)}s;animation-delay:-${(Math.random()*12).toFixed(1)}s"></span>`}).join('');
  $('#root').innerHTML=`<div class="auth"><section class="auth-art">
   <div class="bubbles">${bub}</div>
   <div class="stage" aria-hidden="true"><div class="bottle"><b></b><i></i><i></i><u></u></div></div>
   <span class="lg"><img src="${window.DEEP_LOGO}" alt="DEEP"></span>
   <div style="display:grid;gap:18px;position:relative;z-index:2"><h1>Business suite for DEEP Aqua</h1><p class="hideable">Billing, GST invoices, returns, inward, wastage and reports for the DEEP paper bottle — with live stock and role based access.</p>
   <ul class="hideable"><li>GST tax invoices as PDF</li><li>Live stock across inward, sales, returns and wastage</li><li>Role based access for every user</li><li>Distributor and agency self-service portal</li></ul></div>
   <p class="hideable" style="font-size:12.5px;color:#8fb3c9;position:relative;z-index:2">LST Private Limited · Salem, Tamil Nadu · info@deepaqua.in</p></section>
   <main class="auth-main"><div class="auth-card" id="ac">${inner}</div></main></div>`;
  const card=$('#ac');if(card&&matchMedia('(pointer:fine)').matches)tilt(card,5);
}
function showLogin(msg){
  authShell(`<h2>Sign in</h2><p class="sub">DEEP Aqua Business Suite</p>
   <form id="lf">
     <label class="field"><span>Username</span><input type="email" id="e" required autocomplete="username" placeholder="you@deepaqua.in"></label>
     <label class="field"><span>Password</span><input type="password" id="p" required autocomplete="current-password" placeholder="••••••••"></label>
     <div id="m">${msg||''}</div>
     <button class="btn primary" type="submit" style="padding:13px;font-size:15px">Login</button>
     <div style="text-align:center"><button class="linkbtn" type="button" id="fp">Forgot password?</button></div>
   </form>`);
  $('#lf').onsubmit=async e=>{e.preventDefault();const b=e.submitter||$('#lf button[type=submit]');b.disabled=true;b.textContent='Signing in…';
    try{S.user=await DB.signIn($('#e').value,$('#p').value);await afterLogin()}
    catch(err){$('#m').innerHTML=`<div class="msg err">${esc(err.message)}</div>`;b.disabled=false;b.textContent='Login'}};
  $('#fp').onclick=async()=>{const e=$('#e').value;if(!e){$('#m').innerHTML='<div class="msg info">Type your username (email) above, then press Forgot password.</div>';return}
    try{await DB.resetPassword(e);$('#m').innerHTML='<div class="msg ok">Check your inbox for the reset link.</div>'}catch(err){$('#m').innerHTML=`<div class="msg err">${esc(err.message)}</div>`}};
}
async function afterLogin(){
  $('#root').innerHTML='<div class="loading-screen">Loading your data</div>';
  if(S.user.active===false){await DB.signOut();S.user=null;showLogin('<div class="msg err">This login is switched off. Contact your Admin.</div>');return}
  await loadAll();await prepLogo();
  const h=location.hash.slice(1);S.view=VIEWS.some(v=>v.id===h)?h:(['distributor','agency'].includes(S.user.role)?'portal':'dashboard');render();
}

/* ---------------- boot ---------------- */
async function boot(){
  try{await DB.init(SUPABASE_URL,SUPABASE_ANON_KEY)}
  catch(e){authShell(`<h2>Not configured</h2><div class="msg err">${esc(e.message)}</div><p class="sub">Open <b>config.js</b> in the repository, fill in <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b>, commit, and reload this page.</p>`);return}
  try{S.user=await DB.session()}catch(e){S.user=null}
  if(S.user)await afterLogin();else showLogin();
  DB.c.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){const d=modal({title:'Choose a new password',body:'<label class="field"><span>New password (8+)</span><input type="password" id="np"></label>',foot:'<button class="btn primary" data-ok>Save password</button>'});
    d.querySelector('[data-ok]').onclick=async()=>{const v=$('#np',d).value;if(v.length<8)return toast('Use 8+ characters.',1);const r=await DB.c.auth.updateUser({password:v});if(r.error)toast(r.error.message,1);else{d.close();toast('Password updated')}}}});
}
boot();
</script>
